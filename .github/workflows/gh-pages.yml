name: Deploy hub to GitHub Pages
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: docs
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
