[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speedrunning-plms"
version = "0.1.0"
description = "Fixed 15% protein MLM benchmarks and autonomous GPU experiments."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Synthyra" },
]
keywords = ["bioinformatics", "protein-language-models", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "datasets>=4.5.0,<5",
    "huggingface-hub>=0.34.0,<1",
    "numpy>=1.26,<3",
    "PyYAML>=6,<7",
    "torch>=2.5",
    "torchinfo>=1.8,<2",
    "tqdm>=4.66,<5",
    "transformers>=4.57.6,<5",
]

[project.optional-dependencies]
training = [
    "accelerate>=1.12,<2",
    "hf-transfer>=0.1.9,<0.2",
    "hf-xet>=1.2,<2",
    "wandb>=0.19,<1",
]
evaluation = [
    "pandas>=2,<4",
    "scikit-learn>=1.5,<2",
]
test = [
    "build>=1.2,<2",
    "pytest>=8,<9",
    "setuptools>=68",
    "wheel>=0.43",
]

[project.scripts]
speedrun-plm = "speedrunning_plms.research.engine:main"
speedrun-prepare = "speedrunning_plms.research.benchmark:prepare_main"
speedrun-research = "speedrunning_plms.research.runner:main"

[project.urls]
Homepage = "https://github.com/Synthyra/SpeedrunningPLMs"
Issues = "https://github.com/Synthyra/SpeedrunningPLMs/issues"
Repository = "https://github.com/Synthyra/SpeedrunningPLMs.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
