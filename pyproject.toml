[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speedrunning-plms"
version = "2.0.0"
description = "A 10-minute protein masked language model speedrun on a family-disjoint AlphaFold DB split, searched one editable file at a time"
readme = "PUBLIC_README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "datasets>=4.0",
    "huggingface-hub>=0.35",
    "numpy>=2.0",
    "pandas>=2.2",
    "psutil>=7.2.2",
    "pyarrow>=18.0",
    "scikit-learn>=1.6",
    "torch>=2.11",
    "transformers>=5.17",
    "einops>=0.8",  # FastPLMs' ESM2 modules import it
    "wandb>=0.30",
]

[project.optional-dependencies]
hub = ["hf-xet>=1.0"]
test = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/Synthyra/SpeedrunningPLMs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
